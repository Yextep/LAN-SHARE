name: Brisa · APK y pruebas Android

on:
  workflow_dispatch:
  push:
    branches: [brisa-android]
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: read

concurrency:
  group: brisa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Probar protocolo e interfaz
        run: |
          python -m unittest discover -s tests -v
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python scripts/browser_smoke.py
      - name: Compilar app y pruebas
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug assembleDebugAndroidTest lintRelease
      - name: Habilitar aceleración de Android
        run: sudo chmod 666 /dev/kvm
      - name: Probar en Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android_smoke.sh
      - name: Firmar el APK instalable
        env:
          BRISA_SIGNING_KEYSTORE: ${{ secrets.BRISA_SIGNING_KEYSTORE }}
          BRISA_SIGNING_PASSWORD: ${{ secrets.BRISA_SIGNING_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'brisa.p12'
          path.write_bytes(base64.b64decode(os.environ['BRISA_SIGNING_KEYSTORE']))
          path.chmod(0o600)
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/brisa.p12" --ks-key-alias brisa \
            --ks-pass env:BRISA_SIGNING_PASSWORD --key-pass env:BRISA_SIGNING_PASSWORD \
            --out android/app/build/outputs/apk/release/Brisa.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/Brisa.apk
          rm "$RUNNER_TEMP/brisa.p12"
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Brisa-APK
          path: android/app/build/outputs/apk/release/Brisa.apk
          if-no-files-found: error
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Brisa-pruebas-y-vistas
          path: |
            docs/*.png
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
